aid: keybase
name: Keybase
description: >-
  Keybase is an end-to-end encrypted messaging, file-sharing, and key-directory
  platform built on public-key cryptography, founded by Chris Coyne and Max
  Krohn and acquired by Zoom in 2020. It maps human-readable usernames to public
  keys and cryptographically verifiable social-identity proofs (Twitter, GitHub,
  Reddit, Hacker News, personal domains, and cryptocurrency addresses), and
  provides encrypted chat, teams, KBFS encrypted filesystem, git, and a wallet.
  Keybase exposes a public read-oriented HTTP JSON API (version 1.0) at
  keybase.io/_/api/1.0 for user lookup, PGP key fetch, Merkle-tree verification,
  and session/signature auth, plus officially supported chat-bot SDKs for
  Node.js, Python, and Go that script the local keybase client and CLI.
