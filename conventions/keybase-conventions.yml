generated: '2026-07-20'
method: searched
source: https://keybase.io/docs/api/1.0
docs: https://keybase.io/docs/api/1.0
description: >-
  Cross-cutting request/response conventions for the Keybase API 1.0, captured
  from the public API documentation.
authentication:
  style: session-token + signature (see authentication/keybase-authentication.yml)
  public_read: true
transport:
  base_url: https://keybase.io/_/api/1.0
  formats: [json]
  path_suffix: >-
    Endpoints are addressed with a .json suffix (e.g. user/lookup.json);
    responses are JSON.
  methods: [GET, POST]
  cors: true            # documented: supports cross-origin AJAX from any website
error_envelope:
  shape: '{ status: { code: <int>, name: <string> }, ...payload }'
  success: 'status.code = 0, status.name = "OK"'
  notes: >-
    Every response carries a top-level status object. Non-zero codes indicate
    errors; see errors/keybase-problem-types.yml. Not RFC 9457 problem+json.
idempotency:
  supported: false
  notes: No idempotency-key mechanism is documented in the public API.
pagination:
  supported: false
  notes: >-
    Lookup endpoints return the full result set (e.g. one entry per requested
    username, null for not-found); no cursor/offset pagination is documented.
versioning:
  scheme: uri-path
  current: '1.0'
  notes: >-
    Docs note the API is alpha and "subject to change without version bumps."
tracing:
  request_id: not documented
rate_limit_signal:
  documented: false
